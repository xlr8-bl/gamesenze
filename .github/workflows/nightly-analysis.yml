name: Nightly analysis

# §3.5: 4 minutes daily, 120/month.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # The step this file's name has always implied but never ran: nothing
      # else in the pipeline writes a fixture for the first time, everything
      # downstream reads one that already exists.
      # fixture_sync no longer calls API-Football directly: its free tier
      # cannot serve the current season ("Free plans do not have access to
      # this season, try from 2022 to 2024" — found live, not documented
      # anywhere). football-data.org's free tier covers 9 of our 17
      # competitions for the current season instead; see
      # docs/OPERATIONS.md for the split and gamesenze/jobs/fixture_sync.py
      # for why API-Football stays wired for historical backtest data only.
      - name: Sync fixtures from resolved competitions
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: python -m gamesenze.jobs.fixture_sync

      - name: Compute features, draft picks
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SPORTSGAMEODDS_KEY: ${{ secrets.SPORTSGAMEODDS_KEY }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python -m gamesenze.jobs.nightly_analysis

      # Drafts only. REQ-QA-3 means nothing here can publish on its own: a
      # person reads every pick before it goes out, and the gate enforces it.
      - name: Report drafts awaiting review
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m gamesenze.jobs.review_queue
