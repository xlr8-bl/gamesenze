name: Deploy frontend

# §3.5: 1 minute daily, 30/month.
on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy-frontend.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - working-directory: web
        run: npm ci

      # REQ-BUDGET-2: the browser never calls a vendor API. The build reads
      # Supabase with the anon key and RLS; no vendor key is ever shipped to
      # the client, and none is available to this step.
      - working-directory: web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx netlify-cli deploy --dir=web/out --prod
