name: Set up GameSenze
description: Python, dependencies and a cached venv. Shared so every workflow spends the same startup minutes.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip

    - name: Install
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[scrape]"
